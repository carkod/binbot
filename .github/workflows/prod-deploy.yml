name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, default: latest"
        required: false
        default: ""
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  API_IMAGE: carloswufei/binbot
  TERMINAL_IMAGE: carloswufei/binbot_nginx
  STREAMING_IMAGE: carloswufei/binbot_streaming
  CRONJOBS_IMAGE: carloswufei/binbot_cronjobs

jobs:
  deploy:
    name: Release new production version
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deploy image tags
        id: deploy_tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          normalize_image_tag() {
            local image_tag
            image_tag="$(printf '%s' "$1" | xargs)"

            if [ -z "$image_tag" ]; then
              image_tag="latest"
            fi

            printf '%s\n' "$image_tag"
          }

          image_tag="$(normalize_image_tag "$IMAGE_TAG")"

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $image_tag"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.4
        env:
          IMAGE_TAG: ${{ steps.deploy_tags.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /var/www/terminal.binbot.in
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            for image in \
              carloswufei/binbot \
              carloswufei/binbot_nginx \
              carloswufei/binbot_streaming \
              carloswufei/binbot_cronjobs
            do
              docker pull "$image:$IMAGE_TAG"
              docker tag "$image:$IMAGE_TAG" "$image:latest"
            done
            docker compose up --pull never -d
            docker image prune -f
