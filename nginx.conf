upstream binbot_api {
    zone binbot_api 64k;
    # Refresh Docker DNS when the API container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server binbot:8000 resolve;
}

server {
    listen 80;
    server_name terminal.binbot.in;

    # Proxy /binance requests to the real Binance API
    location /binance/ {
        proxy_pass https://api.binance.com/;
        proxy_set_header Host api.binance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name api.binance.com;
    }

    # Proxy /kucoin-futures requests to the real KuCoin Futures API
    location /kucoin-futures/ {
        proxy_pass https://api-futures.kucoin.com/;
        proxy_set_header Host api-futures.kucoin.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name api-futures.kucoin.com;
    }

    # Proxy /kucoin requests to the real KuCoin API
    location /kucoin/ {
        proxy_pass https://api.kucoin.com/;
        proxy_set_header Host api.kucoin.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name api.kucoin.com;
    }

    location /api/ {
        proxy_pass http://binbot_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8000;
    server_name api.terminal.binbot.in;

    location / {
        proxy_pass http://binbot_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
