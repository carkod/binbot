[project]
name = "Binbot"
version = "2.0.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sqlmodel>=0.0.37",
    "psycopg2-binary>=2.9.12",
    "python-jose",
    "passlib",
    "requests-html>=0.10.0",
    "py3cw>=0.0.39",
    "apscheduler>=3.6.3",
    "requests-cache>=1.3.1",
    "py4j>=0.10.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.18.4",
    "alembic-postgresql-enum",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pybinbot>=2.1.0",
]

[project.urls]
Documentation = "https://carkod.github.io/binbot/"
Repository = "https://github.com/carkod/binbot"


[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
    "coverage",
    "pytest-vcr>=1.0.2",
    "vcrpy>=9.4.2",
    "types-requests>=2.33.0.20260518",
    "types-python-dateutil",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "ruff==0.17.4",
]

[tool.ruff.lint]
# Preserve the existing lint policy across Ruff's expanded default rules.
select = ["E4", "E7", "E9", "F"]
